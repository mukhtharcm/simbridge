<!doctype html>
<!-- The README's explainer video. The stills in assets/ come from docs/shots/make.sh; render with make.sh here. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #14213d; }
      #ground { position: absolute; inset: 0; background: #14213d; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="30" data-width="1920" data-height="1080">
      <div id="ground"></div>
      <div id="intro" data-composition-id="intro" data-composition-src="compositions/intro.html" data-start="0" data-duration="5.4"
           data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="texts" data-composition-id="texts" data-composition-src="compositions/texts.html" data-start="5.4" data-duration="7.4"
           data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="calls" data-composition-id="calls" data-composition-src="compositions/calls.html" data-start="12.8" data-duration="6.6"
           data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="how" data-composition-id="how" data-composition-src="compositions/how.html" data-start="19.4" data-duration="7"
           data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="end" data-composition-id="end" data-composition-src="compositions/end.html" data-start="26.4" data-duration="3.6"
           data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
