<!doctype html>
<!-- The README pictures: the client (with demo.js) in a browser window and phone frames. make.sh shoots it. -->
<meta charset="utf-8">
<title>simbridge shots</title>
<style>
  @font-face { font-family: Bricolage; src: url(bricolage-grotesque.woff2); font-weight: 200 800; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { width: 1600px; height: 900px; overflow: hidden; font-family: Bricolage, system-ui, sans-serif; position: relative; }
  .hero { background: radial-gradient(1100px 700px at 85% 110%, #2a3a63 0%, transparent 60%),
                      radial-gradient(700px 500px at 0% 0%, #1d2c52 0%, transparent 70%), #14213d; }
  .light { background: radial-gradient(900px 500px at 50% 0%, #fff 0%, transparent 70%), #e9edf3; }

  .window { position: absolute; border-radius: 14px; overflow: hidden; background: #fff;
            box-shadow: 0 40px 90px -20px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.08); }
  .bar { height: 40px; background: #e8ebf0; display: flex; align-items: center; gap: 8px; padding: 0 16px; }
  .bar i { width: 12px; height: 12px; border-radius: 50%; background: #c9ced8; }
  .bar span { margin-left: 18px; flex: 0 1 420px; height: 24px; border-radius: 8px; background: #fff; color: #5b6478;
              font-size: 13px; display: flex; align-items: center; padding-left: 12px; gap: 6px; }

  .phone { position: absolute; width: 410px; height: 864px; border-radius: 64px; padding: 10px; background: #0b0f19;
           box-shadow: 0 0 0 2px #2b3243, 0 40px 80px -20px rgba(0,0,0,.6); transform-origin: top left; }
  .phone iframe { border-radius: 54px; }
  .phone::after { content: ''; position: absolute; top: 22px; left: 50%; width: 112px; height: 32px; margin-left: -56px;
                  border-radius: 20px; background: #0b0f19; }
  .status { position: absolute; top: 26px; left: 50px; right: 40px; height: 24px; display: flex; align-items: center;
            justify-content: space-between; font: 600 17px/1 -apple-system, system-ui, sans-serif; pointer-events: none; }
  .status span { display: flex; gap: 7px; align-items: center; }
  .status svg { height: 12px; fill: currentColor; }
  .status svg:first-child { width: 18px; } .status svg:last-child { width: 27px; height: 13px; }
  iframe { display: block; border: 0; width: 390px; height: 844px; }

  .caption { position: absolute; top: 790px; width: 330px; text-align: center; font-size: 22px; font-weight: 600;
             color: #14213d; letter-spacing: -0.01em; }
</style>
<body>
<script>
const shot = location.hash.slice(1) || 'hero';
const add = (html) => document.body.insertAdjacentHTML('beforeend', html);
// A phone's status bar, drawn over the screen in the colour of what is under it.
const bar = `<div class="status"><b>9:41</b><span>
  <svg viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
  <svg viewBox="0 0 27 13"><rect x="0.5" y="0.5" width="23" height="12" rx="3.5" fill="none" stroke="currentColor" opacity=".4"/><rect x="2.5" y="2.5" width="17" height="8" rx="2"/><rect x="25" y="4.5" width="1.6" height="4" rx=".8" opacity=".4"/></svg></span></div>`;
const phone = (view, x, y, scale, light = false) =>
  add(`<div class="phone" style="left:${x}px;top:${y}px;transform:scale(${scale});color:${light ? '#14213d' : '#fff'}">
         <iframe src="index.html${view.includes('#') ? view : '#' + view}"></iframe>${bar}</div>`);

if (shot.startsWith('phone:')) {
  // One phone on a clear ground, for the video: #phone:ringing, or #phone:?t=4#call.
  phone(decodeURIComponent(shot.slice(6)), 0, 0, 1);
  document.querySelector('.phone').style.boxShadow = 'none';
} else if (shot === 'hero') {
  document.body.className = 'hero';
  add(`<div class="window" style="left:70px;top:120px;width:1060px">
         <div class="bar"><i></i><i></i><i></i><span>🔒 sim.example.com</span></div>
         <iframe src="index.html#thread" style="width:1180px;height:760px;transform:scale(.898);transform-origin:top left;margin-bottom:-78px"></iframe>
       </div>`);
  phone('call', 1190, 90, 0.84);
} else if (shot === 'how') {
  // How the parts connect: boxes on a row, the push path underneath.
  document.body.className = 'light';
  const box = (x, y, w, title, sub, dark) => `
    <rect x="${x}" y="${y}" width="${w}" height="150" rx="22" fill="${dark ? '#14213d' : '#fff'}" stroke="${dark ? 'none' : '#dde1e7'}" stroke-width="2"/>
    <text x="${x + w / 2}" y="${y + 66}" class="t" fill="${dark ? '#fff' : '#14213d'}">${title}</text>
    <text x="${x + w / 2}" y="${y + 102}" class="s" fill="${dark ? '#b8c0d3' : '#5b6478'}">${sub}</text>`;
  const label = (x, y, text) => `<text x="${x}" y="${y}" class="l">${text}</text>`;
  add(`<svg width="1600" height="560" viewBox="0 0 1600 560" style="position:absolute;inset:0">
    <style>.t{font:700 34px Bricolage;text-anchor:middle;letter-spacing:-.02em}.s{font:500 22px Bricolage;text-anchor:middle}
      .l{font:600 20px Bricolage;fill:#5b6478;text-anchor:middle}</style>
    <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#14213d"/></marker>
      <marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c9a227"/></marker></defs>
    <path d="M70 120h86l34 34v72a14 14 0 0 1-14 14H70a14 14 0 0 1-14-14V134a14 14 0 0 1 14-14z" fill="#c9a227"/>
    <rect x="86" y="160" width="74" height="54" rx="8" fill="#f6edcb"/>
    ${label(123, 290, 'The SIM')}
    <line x1="200" y1="180" x2="262" y2="180" stroke="#14213d" stroke-width="3"/>
    ${box(270, 105, 330, 'simbridge', 'on the spare phone', true)}
    <line x1="608" y1="180" x2="802" y2="180" stroke="#14213d" stroke-width="3" marker-start="url(#a)" marker-end="url(#a)"/>
    ${label(705, 150, 'WebSocket API')}${label(705, 222, 'texts, calls, audio')}
    ${box(810, 105, 300, 'HTTPS proxy', 'on your private network')}
    <line x1="1118" y1="180" x2="1252" y2="180" stroke="#14213d" stroke-width="3" marker-start="url(#a)" marker-end="url(#a)"/>
    ${box(1260, 105, 290, 'Web client', 'or your own app', true)}
    <path d="M435 263V430H760" fill="none" stroke="#c9a227" stroke-width="3" stroke-dasharray="10 9" marker-end="url(#g)"/>
    <path d="M1100 430H1405V263" fill="none" stroke="#c9a227" stroke-width="3" stroke-dasharray="10 9" marker-end="url(#g)"/>
    <rect x="770" y="380" width="320" height="100" rx="22" fill="#f6edcb"/>
    <text x="930" y="424" class="t" style="font-size:28px" fill="#14213d">Push service</text>
    <text x="930" y="456" class="s" fill="#5b6478">Apple, Google or Mozilla</text>
    ${label(600, 410, 'encrypted notification')}${label(1250, 410, 'even with the client closed')}
  </svg>`);
} else {
  // Four phones in a row, each with a caption under it.
  document.body.className = 'light';
  const views = [['messages', 'Texts', true], ['recents', 'Call history', true], ['contacts-dark', 'Contacts, in dark mode'], ['ringing', 'Incoming calls']];
  views.forEach(([view, label, light], i) => {
    const x = 70 + i * 370;
    phone(view, x, 70, 0.8, light);
    add(`<div class="caption" style="left:${x}px">${label}</div>`);
  });
}
</script>
